name: GlowSync Quality & Security Gate

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Quality & security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync database schema
        run: npx prisma db push
        env:
          DATABASE_URL: "file:./prisma/ci.db"

      - name: Lint
        run: npm run lint

      - name: Security audit
        run: npm audit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./prisma/ci.db"
          AUTH_SECRET: "ci-placeholder-secret-minimum-32-characters-long"
